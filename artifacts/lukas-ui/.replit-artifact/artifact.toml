kind = "web"
previewPath = "/"
title = "Lukas AI"
version = "1.0.0"
id = "artifacts/lukas-ui"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18186

[services.development]
run = "pnpm --filter @workspace/lukas-ui run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lukas-ui", "run", "build" ]
publicDir = "artifacts/lukas-ui/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18186"
BASE_PATH = "/"
