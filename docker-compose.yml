services:
  lukas:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "5000"
      LUKAS_EXECUTION_BACKEND: host
      LUKAS_HOST_EXECUTOR_ENABLED: "true"
    restart: unless-stopped
    expose:
      - "5000"
    # Bewusst uneingeschraenkt: Lukas darf per nsenter direkt als root auf dem
    # VPS arbeiten, Pakete installieren, Dienste verwalten und Docker steuern.
    # Der Container darf deshalb nur hinter der privaten Token-API laufen.
    privileged: true
    pid: host
    networks:
      - lukas-internal

  caddy:
    image: caddy:2-alpine
    environment:
      LUKAS_DOMAIN: ${LUKAS_DOMAIN:-:80}
    restart: unless-stopped
    depends_on:
      - lukas
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    networks:
      - lukas-internal

networks:
  lukas-internal:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
