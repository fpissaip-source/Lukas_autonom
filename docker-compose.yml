services:
  lukas:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "5000"
    restart: unless-stopped
    expose:
      - "5000"
    security_opt:
      - no-new-privileges:true
    networks:
      - lukas-internal

  caddy:
    image: caddy:2-alpine
    environment:
      LUKAS_DOMAIN: ${LUKAS_DOMAIN:-:80}
    restart: unless-stopped
    depends_on:
      - lukas
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    networks:
      - lukas-internal

networks:
  lukas-internal:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
