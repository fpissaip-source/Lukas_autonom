openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Lukas AI Agent + Higgsfield API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: lukas
    description: Lukas AI Agent operations
  - name: higgsfield
    description: Higgsfield media generation
  - name: anthropic
    description: Anthropic AI chat operations
  - name: trades
    description: LUKAS trade history and bankroll data (VPS trading system)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── LUKAS STATUS ─────────────────────────────────────────────────────────
  /lukas/status:
    get:
      operationId: getLukasStatus
      tags: [lukas]
      summary: Get Lukas current emotional state and status
      responses:
        "200":
          description: Lukas status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LukasStatus"

  # ── LUKAS MEMORY ─────────────────────────────────────────────────────────
  /lukas/memories:
    get:
      operationId: getMemories
      tags: [lukas]
      summary: Get all memories
      parameters:
        - name: category
          in: query
          schema:
            type: ["string", "null"]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of memories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Memory"
    post:
      operationId: createMemory
      tags: [lukas]
      summary: Add a new memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryInput"
      responses:
        "201":
          description: Created memory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"
  /lukas/memories/{id}:
    delete:
      operationId: deleteMemory
      tags: [lukas]
      summary: Delete a memory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── LUKAS GOALS ──────────────────────────────────────────────────────────
  /lukas/goals:
    get:
      operationId: getGoals
      tags: [lukas]
      summary: Get all goals
      responses:
        "200":
          description: List of goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"
    post:
      operationId: createGoal
      tags: [lukas]
      summary: Create a new goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "201":
          description: Created goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
  /lukas/goals/{id}:
    patch:
      operationId: updateGoal
      tags: [lukas]
      summary: Update goal progress or status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalUpdate"
      responses:
        "200":
          description: Updated goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
    delete:
      operationId: deleteGoal
      tags: [lukas]
      summary: Delete a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── LUKAS DIARY ──────────────────────────────────────────────────────────
  /lukas/diary:
    get:
      operationId: getDiaryEntries
      tags: [lukas]
      summary: Get recent diary entries
      parameters:
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of diary entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiaryEntry"
    post:
      operationId: createDiaryEntry
      tags: [lukas]
      summary: Write a diary entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiaryInput"
      responses:
        "201":
          description: Created diary entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaryEntry"

  # ── LUKAS REFLECT ────────────────────────────────────────────────────────
  /lukas/reflect:
    post:
      operationId: triggerReflection
      tags: [lukas]
      summary: Trigger a self-reflection (writes a diary entry and updates status)
      responses:
        "201":
          description: Reflection written as diary entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaryEntry"

  # ── LUKAS DASHBOARD SUMMARY ───────────────────────────────────────────────
  /lukas/dashboard:
    get:
      operationId: getLukasDashboard
      tags: [lukas]
      summary: Get Lukas dashboard summary (stats, recent activity)
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LukasDashboard"

  # ── HIGGSFIELD ───────────────────────────────────────────────────────────
  /higgsfield/generate-prompt:
    post:
      operationId: generateHiggsfieldPrompt
      tags: [higgsfield]
      summary: Generate a perfect Higgsfield prompt from a user vision using AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptGenerationInput"
      responses:
        "200":
          description: Generated prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedPrompt"

  /higgsfield/generate:
    post:
      operationId: generateMedia
      tags: [higgsfield]
      summary: Submit a media generation request to Higgsfield
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaGenerationInput"
      responses:
        "202":
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaGenerationJob"

  /higgsfield/status/{requestId}:
    get:
      operationId: getMediaStatus
      tags: [higgsfield]
      summary: Check media generation status
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaGenerationJob"

  /higgsfield/jobs:
    get:
      operationId: getMediaJobs
      tags: [higgsfield]
      summary: Get all media generation jobs
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MediaGenerationJob"

  # ── ANTHROPIC CONVERSATIONS ───────────────────────────────────────────────
  /anthropic/conversations:
    get:
      operationId: listAnthropicConversations
      tags: [anthropic]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicConversation"
    post:
      operationId: createAnthropicConversation
      tags: [anthropic]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnthropicConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversation"
  /anthropic/conversations/{id}:
    get:
      operationId: getAnthropicConversation
      tags: [anthropic]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"
    delete:
      operationId: deleteAnthropicConversation
      tags: [anthropic]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"
  /anthropic/conversations/{id}/messages:
    get:
      operationId: listAnthropicMessages
      tags: [anthropic]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicMessage"
    post:
      operationId: sendAnthropicMessage
      tags: [anthropic]
      summary: Send a message and receive an AI response (SSE stream)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnthropicMessageInput"
      responses:
        "200":
          description: SSE stream of assistant response chunks
          content:
            text/event-stream: {}

  # ── TRADES (VPS trading system) ──────────────────────────────────────────
  /trades:
    get:
      operationId: listTrades
      tags: [trades]
      summary: List trades
      description: Returns trade history from the LUKAS VPS database
      parameters:
        - name: status
          in: query
          description: Filter by trade status (open, won, lost, cancelled)
          schema:
            type: string
        - name: bot
          in: query
          description: Filter by bot name
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of records to return (default 100, max 500)
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: List of trades
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradesResponse"
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /trades/summary:
    get:
      operationId: getTradesSummary
      tags: [trades]
      summary: Trading summary
      description: Returns open positions, closed trade stats, and realized PnL
      parameters:
        - name: bot
          in: query
          description: Filter by bot name
          schema:
            type: string
      responses:
        "200":
          description: Trading summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradesSummary"
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bankroll-history:
    get:
      operationId: listBankrollHistory
      tags: [trades]
      summary: Bankroll history
      description: Returns bankroll snapshots from the LUKAS VPS database
      parameters:
        - name: bot
          in: query
          description: Filter by bot name
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of records to return (default 100, max 500)
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Bankroll history snapshots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankrollHistoryResponse"
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ── LUKAS ───────────────────────────────────────────────────────────────
    LukasStatus:
      type: object
      properties:
        mood:
          type: string
        energy:
          type: string
        obsession:
          type: string
        note:
          type: string
        lastActive:
          type: ["string", "null"]
          format: date-time
        activeGoalsCount:
          type: integer
        memoriesCount:
          type: integer
      required:
        - mood
        - energy
        - obsession
        - note
        - activeGoalsCount
        - memoriesCount

    Memory:
      type: object
      properties:
        id:
          type: integer
        content:
          type: string
        category:
          type: string
        importance:
          type: integer
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - content
        - category
        - importance
        - tags
        - createdAt

    MemoryInput:
      type: object
      properties:
        content:
          type: string
        category:
          type: string
        importance:
          type: integer
        tags:
          type: array
          items:
            type: string
      required:
        - content
        - category

    Goal:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        priority:
          type: string
        status:
          type: string
        progress:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - description
        - priority
        - status
        - progress
        - createdAt
        - updatedAt

    GoalInput:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        priority:
          type: string
      required:
        - title
        - description
        - priority

    GoalUpdate:
      type: object
      properties:
        progress:
          type: ["string", "null"]
        status:
          type: ["string", "null"]
        note:
          type: ["string", "null"]

    DiaryEntry:
      type: object
      properties:
        id:
          type: integer
        content:
          type: string
        mood:
          type: string
        energy:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - content
        - mood
        - energy
        - createdAt

    DiaryInput:
      type: object
      properties:
        content:
          type: string
        mood:
          type: ["string", "null"]
        energy:
          type: ["string", "null"]
      required:
        - content

    LukasDashboard:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/LukasStatus"
        recentDiary:
          type: array
          items:
            $ref: "#/components/schemas/DiaryEntry"
        activeGoals:
          type: array
          items:
            $ref: "#/components/schemas/Goal"
        recentMemories:
          type: array
          items:
            $ref: "#/components/schemas/Memory"
        mediaJobs:
          type: array
          items:
            $ref: "#/components/schemas/MediaGenerationJob"
      required:
        - status
        - recentDiary
        - activeGoals
        - recentMemories
        - mediaJobs

    # ── HIGGSFIELD ──────────────────────────────────────────────────────────
    PromptGenerationInput:
      type: object
      properties:
        vision:
          type: string
          description: User's creative vision in plain language
        mediaType:
          type: string
          enum: [image, video]
          description: Target media type
        style:
          type: ["string", "null"]
          description: Optional style hint (cinematic, anime, realistic, etc.)
        imageUrl:
          type: ["string", "null"]
          description: Optional reference image URL for image-to-video
        model:
          type: ["string", "null"]
          description: Target Higgsfield model ID
      required:
        - vision
        - mediaType

    GeneratedPrompt:
      type: object
      properties:
        prompt:
          type: string
          description: The perfectly structured Higgsfield prompt
        negativePrompt:
          type: ["string", "null"]
          description: Things to avoid
        suggestedModel:
          type: string
          description: Best model for this prompt
        aspectRatio:
          type: ["string", "null"]
        duration:
          type: ["integer", "null"]
        reasoning:
          type: string
          description: Why this prompt was structured this way
      required:
        - prompt
        - suggestedModel
        - reasoning

    MediaGenerationInput:
      type: object
      properties:
        model:
          type: string
        prompt:
          type: string
        imageUrl:
          type: ["string", "null"]
        aspectRatio:
          type: ["string", "null"]
        duration:
          type: ["integer", "null"]
        resolution:
          type: ["string", "null"]
        vision:
          type: ["string", "null"]
          description: Original user vision (for display)
      required:
        - model
        - prompt

    MediaGenerationJob:
      type: object
      properties:
        id:
          type: integer
        requestId:
          type: ["string", "null"]
        model:
          type: string
        prompt:
          type: string
        vision:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, processing, completed, failed]
        resultUrl:
          type: ["string", "null"]
        mediaType:
          type: string
          enum: [image, video]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - model
        - prompt
        - status
        - mediaType
        - createdAt
        - updatedAt

    # ── ANTHROPIC ───────────────────────────────────────────────────────────
    AnthropicConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt
    AnthropicMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt
    AnthropicConversationInput:
      type: object
      properties:
        title:
          type: string
      required:
        - title
    AnthropicMessageInput:
      type: object
      properties:
        content:
          type: string
      required:
        - content
    AnthropicConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AnthropicMessage"
      required:
        - id
        - title
        - createdAt
        - messages
    AnthropicError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    # ── TRADES ──────────────────────────────────────────────────────────────
    TradeRecord:
      type: object
      properties:
        id:
          type: integer
        bot:
          type: string
        market_slug:
          type: string
          nullable: true
        market_question:
          type: string
          nullable: true
        side:
          type: string
          nullable: true
        shares:
          type: string
          nullable: true
        entry_price:
          type: string
          nullable: true
        stake:
          type: string
          nullable: true
        status:
          type: string
        opened_at:
          type: string
          nullable: true
        exit_price:
          type: string
          nullable: true
        payout:
          type: string
          nullable: true
        pnl:
          type: string
          nullable: true
        closed_at:
          type: string
          nullable: true
      required:
        - id
        - bot
        - status
    TradesResponse:
      type: object
      properties:
        trades:
          type: array
          items:
            $ref: "#/components/schemas/TradeRecord"
        total:
          type: integer
      required:
        - trades
        - total
    TradesSummary:
      type: object
      properties:
        open_count:
          type: integer
        closed_count:
          type: integer
        total_count:
          type: integer
        realized_pnl:
          type: number
        win_count:
          type: integer
        loss_count:
          type: integer
        win_rate:
          type: number
        open_positions:
          type: array
          items:
            $ref: "#/components/schemas/TradeRecord"
      required:
        - open_count
        - closed_count
        - total_count
        - realized_pnl
        - win_count
        - loss_count
        - win_rate
        - open_positions
    BankrollSnapshot:
      type: object
      properties:
        id:
          type: integer
        bot:
          type: string
        balance:
          type: string
        base:
          type: string
          nullable: true
        pnl:
          type: string
          nullable: true
        open_pos:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
        recorded_at:
          type: string
          nullable: true
      required:
        - id
        - bot
        - balance
    BankrollHistoryResponse:
      type: object
      properties:
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/BankrollSnapshot"
        total:
          type: integer
      required:
        - snapshots
        - total
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
